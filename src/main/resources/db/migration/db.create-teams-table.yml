databaseChangeLog:
  - changeSet:
      id: create-teams-table-v2
      author: anhhien
      changes:
        - createTable:
            tableName: teams
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: logo_url
                  type: varchar(255)