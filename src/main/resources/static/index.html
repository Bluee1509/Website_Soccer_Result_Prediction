<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Thi Đấu WC2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes live-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }
        .animate-live { animation: live-pulse 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 font-sans text-slate-800">

<header class="sticky top-0 z-50 flex items-center justify-between bg-gradient-to-r from-blue-900 to-indigo-900 px-6 py-4 text-white shadow-md">
    <div class="flex items-center gap-3">
        <span class="text-3xl">🏆</span>
        <h1 class="text-xl font-black tracking-wider text-yellow-400 sm:text-2xl">LỊCH THI ĐẤU WC2026</h1>
    </div>

    <nav class="flex items-center gap-6 font-medium" id="auth-nav"></nav>
</header>

<main class="flex-1 flex flex-col max-w-6xl w-full mx-auto px-4 py-8">

    <div class="flex-1">
        <div id="loading-view" class="flex flex-col items-center justify-center my-20 gap-3">
            <div class="w-12 h-12 border-4 border-blue-900 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-500 font-medium text-lg">Đang tải lịch thi đấu từ hệ thống...</p>
        </div>

        <div id="match-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
        </div>
    </div>

    <div id="pagination-bar" class="w-full flex items-center justify-center gap-4 mt-12 pt-6 border-t border-slate-200 hidden">
        <button id="btn-prev" onclick="prevPage()" class="cursor-pointer flex items-center justify-center px-4 py-2 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm transition-all">
            ◀ Trước
        </button>
        <span id="page-info" class="bg-blue-900 text-white px-5 py-2 rounded-xl font-bold text-sm shadow-md">
                Trang 1 / 1
        </span>
        <button id="btn-next" onclick="nextPage()" class="cursor-pointer flex items-center justify-center px-4 py-2 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm transition-all">
            Sau ▶
        </button>
    </div>
</main>

<footer class="bg-slate-100 py-6 border-t border-slate-200 mt-auto text-center text-sm text-slate-500">
    &copy; 2026 Hệ thống dự đoán Kết quả Bóng Đá. Bản quyền thuộc về Bluee.
</footer>

<script>
    const API_BASE_URL = '/api/matches';

    let currentPage = 0;
    const pageSize = 6;
    let totalPages = 1;

    function formatMatchDate(dateString) {
        if (!dateString) return 'Chưa rõ thời gian';
        if (Array.isArray(dateString)) {
            const [year, month, day, hour, minute] = dateString;
            const date = new Date(year, month - 1, day, hour, minute);
            return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
                ' ' + date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        }
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString;

        return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
            ' ' + date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }

    async function loadMatches() {
        const loadingView = document.getElementById('loading-view');
        const matchGrid = document.getElementById('match-grid');
        const paginationBar = document.getElementById('pagination-bar');

        loadingView.classList.remove('hidden');
        matchGrid.classList.add('hidden');
        paginationBar.classList.add('hidden');

        try {
            const response = await fetch(`${API_BASE_URL}?page=${currentPage}&size=${pageSize}`);
            if (!response.ok) throw new Error('Không thể lấy dữ liệu');

            const data = await response.json();
            const matches = data.content || data;
            totalPages = data.totalPages || 1;

            matchGrid.innerHTML = '';

            if (matches.length === 0) {
                matchGrid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">Hiện tại chưa có trận đấu nào được cập nhật.</p>`;
            } else {
                matches.forEach(match => {
                    let statusBadge = '';
                    if (match.status === 'FINISHED') {
                        statusBadge = `<span class="text-[10px] font-black bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full uppercase tracking-wider">Kết thúc</span>`;
                    } else if (match.status === 'ONGOING') {
                        statusBadge = `<span class="text-[10px] font-black bg-orange-500 text-white px-2.5 py-1 rounded-full uppercase tracking-wider flex items-center gap-1 animate-live"><span class="w-1.5 h-1.5 bg-white rounded-full"></span> Trực tiếp</span>`;
                    } else {
                        statusBadge = `<span class="text-[10px] font-black bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full uppercase tracking-wider">Chưa đá</span>`;
                    }

                    let scoreDisplay = '';
                    if (match.status !== 'PENDING') {
                        scoreDisplay = `<div class="font-mono text-3xl font-black tracking-tight text-slate-900 bg-slate-100 px-4 py-1.5 rounded-xl border border-slate-200 shadow-inner">${match.homeScore} - ${match.awayScore}</div>`;
                    } else {
                        scoreDisplay = `<div class="text-xs font-black text-slate-400 tracking-widest bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 uppercase">VS</div>`;
                    }

                    matchGrid.innerHTML += `
                            <div class="bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 overflow-hidden flex flex-col justify-between">
                                <div class="bg-slate-50/80 px-4 py-3 flex justify-between items-center border-b border-slate-100">
                                    <span class="text-xs font-bold text-slate-500">📅 ${formatMatchDate(match.startTime)}</span>
                                    ${statusBadge}
                                </div>
                                <div class="p-6 flex items-center justify-between gap-2 my-auto">
                                    <div class="flex flex-col items-center text-center flex-1">
                                        <span class="text-3xl mb-1">⚽</span>
                                        <span class="font-bold text-slate-900 text-sm font-sans block">${match.homeTeam?.name || 'Đội nhà'}</span>
                                    </div>
                                    <div class="flex flex-col items-center px-4">${scoreDisplay}</div>
                                    <div class="flex flex-col items-center text-center flex-1">
                                        <span class="text-3xl mb-1">⚽</span>
                                        <span class="font-bold text-slate-900 text-sm font-sans block">${match.awayTeam?.name || 'Đội khách'}</span>
                                    </div>
                                </div>
                                <div class="px-5 py-3.5 bg-slate-50/50 border-t border-slate-100">
                                    <a href="match-detail.html?id=${match.id}" class="block text-xs font-bold text-center w-full py-2.5 bg-blue-900 hover:bg-blue-800 text-white rounded-xl active:scale-95 transition-all shadow-sm">
                                        Chi tiết trận đấu
                                    </a>
                                </div>
                            </div>
                        `;
                });
            }

            document.getElementById('page-info').innerText = `Trang ${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = (currentPage === 0);
            document.getElementById('btn-next').disabled = (currentPage >= totalPages - 1);

            loadingView.classList.add('hidden');
            matchGrid.classList.remove('hidden');
            paginationBar.classList.remove('hidden');

        } catch (error) {
            console.error(error);
            loadingView.innerHTML = `<p class="text-red-500 font-bold p-6 text-center">Lỗi: Không kết nối được tới Backend Spring Boot cổng 8080!</p>`;
        }
    }

    function nextPage() { if (currentPage < totalPages - 1) { currentPage++; loadMatches(); } }
    function prevPage() { if (currentPage > 0) { currentPage--; loadMatches(); } }

    function renderHeaderAuth() {
        const nav = document.getElementById('auth-nav');
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username') || 'Tài khoản';
        const role = localStorage.getItem('role');

        if (token) {
            let adminBtn = (role === 'ADMIN' || role === 'ROLE_ADMIN')
                ? `<a href="admin.html" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-all">⚙️ Quản trị</a>`
                : '';

            nav.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-slate-200 bg-blue-800/50 px-3 py-1.5 rounded-full text-sm border border-blue-700">
                            Xin chào, <strong class="text-white font-semibold">${username}</strong>
                        </span>
                        ${adminBtn}
                        <a href="profile.html" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-all">
                            👤 Trang cá nhân
                        </a>
                        <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-all text-white">
                            Đăng xuất
                        </button>
                    </div>
                `;
        } else {
            nav.innerHTML = `
                    <a href="login.html" class="hover:text-slate-200 text-sm font-semibold transition-colors">Đăng nhập</a>
                    <a href="register.html" class="bg-yellow-500 hover:bg-yellow-600 text-slate-950 px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-all">Đăng ký</a>
                `;
        }
    }

    function handleLogout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('role');
        localStorage.removeItem('userId');
        renderHeaderAuth();
    }

    window.onload = function() {
        renderHeaderAuth();
        loadMatches();
    };
</script>
</body>
</html>
