<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - WC2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col justify-between font-sans text-slate-800">

<header class="bg-gradient-to-r from-blue-900 to-indigo-900 px-6 py-4 text-white shadow-md flex justify-between items-center">
    <div class="flex items-center gap-3">
        <span class="text-2xl">🏆</span>
        <h1 class="text-lg font-black tracking-wider text-yellow-400 sm:text-xl">LỊCH THI ĐẤU WC2026</h1>
    </div>
    <a href="index.html" class="text-sm font-semibold text-slate-200 hover:text-yellow-400 transition-colors">
        ◀ Về trang chủ
    </a>
</header>

<main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 w-full max-w-md">
        <h2 class="text-2xl font-black text-center text-slate-900 mb-2 uppercase tracking-wide">Đăng Nhập</h2>
        <p class="text-slate-400 text-center text-sm mb-6">Điền tài khoản hệ thống để tiếp tục</p>

        <div id="error-msg" class="bg-red-50 border border-red-200 text-red-600 px-4 py-2.5 rounded-xl text-sm font-semibold mb-4 hidden"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tên tài khoản</label>
                <input type="text" id="username" required
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-900 transition-colors text-sm font-medium">
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mật khẩu</label>
                <input type="password" id="password" required
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-900 transition-colors text-sm font-medium">
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full py-3 bg-blue-900 hover:bg-blue-800 text-white font-bold rounded-xl active:scale-95 shadow-md transition-all text-sm uppercase tracking-wider cursor-pointer">
                Xác nhận đăng nhập
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">Chưa có tài khoản? <a href="register.html" class="text-blue-900 font-bold hover:underline">Đăng ký ngay</a></p>
    </div>
</main>

<footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white">
    &copy; 2026 Hệ thống Lịch thi đấu World Cup. All rights reserved.
</footer>

<script>
    const AUTH_API_URL = '/api/users/login';

    async function handleLogin(event) {
        event.preventDefault();

        const errBox = document.getElementById('error-msg');
        const btnSubmit = document.getElementById('btn-submit');
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;

        errBox.classList.add('hidden');
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'ĐANG XỬ LÝ...';

        try {
            const response = await fetch(AUTH_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            if (response.ok) {
                const data = await response.json();

                // 🌟 LƯU ĐẦY ĐỦ DỮ LIỆU ĐỂ CÁC TRANG KHÁC HOẠT ĐỘNG
                localStorage.setItem('token', data.token || data.accessToken || 'mock-jwt-token');
                localStorage.setItem('username', data.username || usernameInput);
                localStorage.setItem('role', data.role); // 🌟 Quan trọng cho Mắt thần Admin

                if (data.role === 'ADMIN' || data.role === 'ROLE_ADMIN') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                let errorMessage = 'Tài khoản hoặc mật khẩu không chính xác!';
                try {
                    const errData = await response.json();
                    errorMessage = errData.message || errorMessage;
                } catch(e) {}
                errBox.innerText = errorMessage;
                errBox.classList.remove('hidden');
            }
        } catch (error) {
            errBox.innerText = 'Không thể kết nối đến Backend Spring Boot!';
            errBox.classList.remove('hidden');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'XÁC NHẬN ĐĂNG NHẬP';
        }
    }
</script>
</body>
</html>
